name: EAS Build (iOS)

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "Build profile"
        type: choice
        default: production
        options:
          - production
          - development

jobs:
  build:
    name: EAS Build iOS ${{ inputs.profile }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Build iOS (${{ inputs.profile }})
        run: eas build --platform ios --profile ${{ inputs.profile }} --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          GOOGLE_SERVICES_IOS_BASE64: ${{ secrets.GOOGLE_SERVICES_IOS_BASE64 }}

      - name: Submit to TestFlight
        if: inputs.profile == 'production'
        run: eas submit --platform ios --profile production --latest --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
